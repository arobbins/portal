name: check

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      DATABASE_URL: postgres://postgres:password@localhost/webserver
      TEST_DATABASE_URL: postgres://postgres:password@localhost/webserver_test
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true

      - name: Install sqlx-cli and topcoat-cli
        run: |
          command -v sqlx >/dev/null || cargo install sqlx-cli --version 0.9.0 --locked
          command -v topcoat >/dev/null || cargo install topcoat-cli --version 0.12.1 --locked

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright and browsers
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps

      - name: Env file and dev database
        run: |
          cp .env.example .env
          sqlx database create
          sqlx migrate run

      - name: Run ./check.sh
        run: ./check.sh

      - name: sqlx offline data is committed
        run: test -z "$(git status --porcelain -- .sqlx)" || { git status --short -- .sqlx; exit 1; }

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
