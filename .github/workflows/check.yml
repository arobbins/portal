name: check

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

concurrency:
  group: check-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CI: "true"
  DATABASE_URL: postgres://postgres:password@localhost/webserver
  TEST_DATABASE_URL: postgres://postgres:password@localhost/webserver_test

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Format, conventions, clippy, sqlx data, Rust tests
        run: ./check.sh --part rust

      - name: sqlx offline data is committed
        run: test -z "$(git status --porcelain -- .sqlx)" || { git status --short -- .sqlx; exit 1; }

  e2e:
    name: e2e (${{ github.event_name == 'push' && 'chromium' || 'all browsers' }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright and browsers
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps ${{ github.event_name == 'push' && 'chromium' || '' }}

      - name: Playwright
        run: ./check.sh --part e2e -- ${{ github.event_name == 'push' && '--project=chromium' || '' }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
