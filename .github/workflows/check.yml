name: check

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

concurrency:
  group: check-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CI: "true"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  DATABASE_URL: postgres://postgres:password@localhost/webserver
  TEST_DATABASE_URL: postgres://postgres:password@localhost/webserver_test

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: ./.github/actions/setup

      - name: Format, conventions, clippy, sqlx data, Rust tests
        run: ./check.sh --part rust

      - name: sqlx offline data is committed
        run: test -z "$(git status --porcelain -- .sqlx)" || { git status --short -- .sqlx; exit 1; }

  e2e:
    name: e2e (${{ contains(fromJSON('["push","pull_request"]'), github.event_name) && 'chromium' || 'all browsers' }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BROWSER: ${{ contains(fromJSON('["push","pull_request"]'), github.event_name) && 'chromium' || '' }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: ./.github/actions/setup

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright and browsers
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps $BROWSER

      - name: Playwright
        run: ./check.sh --part e2e -- ${BROWSER:+--project=$BROWSER}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
