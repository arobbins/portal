name: setup
description: Rust toolchain, cached build, sqlx and topcoat CLIs, env file and a migrated dev database
runs:
  using: composite
  steps:
    - name: Rust toolchain from rust-toolchain.toml
      shell: bash
      run: rustup show active-toolchain || rustup toolchain install

    - uses: Swatinem/rust-cache@v2
      with:
        cache-all-crates: true

    - name: Install sqlx-cli and topcoat-cli
      shell: bash
      run: |
        command -v sqlx >/dev/null || cargo install sqlx-cli --version 0.9.0 --locked
        command -v topcoat >/dev/null || cargo install topcoat-cli --version 0.12.1 --locked

    - name: Env file and dev database
      shell: bash
      run: |
        cp .env.example .env
        sqlx database create
        sqlx migrate run
