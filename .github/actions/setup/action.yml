name: setup
description: Rust toolchain, cached build, prebuilt sqlx and topcoat CLIs, env file and a migrated dev database
runs:
  using: composite
  steps:
    - name: Rust toolchain from rust-toolchain.toml
      shell: bash
      run: rustup show active-toolchain || rustup toolchain install

    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      with:
        cache-all-crates: true
        cache-on-failure: true

    - name: Install sqlx-cli and topcoat-cli (prebuilt)
      uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c
      with:
        tool: sqlx-cli@0.9.0,topcoat-cli@0.12.1

    - name: Env file and dev database
      shell: bash
      run: |
        cp .env.example .env
        sqlx database create
        sqlx migrate run
