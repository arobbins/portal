[package]
name = "webserver"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "webserver"
path = "src/main.rs"
required-features = ["ssr"]

[dependencies]
leptos = { version = "0.8.22", features = ["islands"] }
leptos_router = "0.8.17"
serde = { version = "1.0", features = ["derive"] }
tracing = "0.1.44"
wasm-bindgen = { version = "0.2", optional = true }
console_error_panic_hook = { version = "0.1.7", optional = true }
web-sys = { version = "0.3", optional = true, features = ["Event", "EventTarget", "Window"] }

leptos_axum = { version = "0.8.10", optional = true }
axum = { version = "0.8.9", features = ["macros"], optional = true }
listenfd = { version = "1.0.2", optional = true }
tokio = { version = "1.52.3", features = ["full"], optional = true }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"], optional = true }
tower = { version = "0.5.3", features = ["util"], optional = true }
tower-http = { version = "0.6.11", features = ["trace", "normalize-path", "fs"], optional = true }
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres", "macros", "time"], optional = true }
dotenvy = { version = "0.15.7", optional = true }
chrono = { version = "0.4.44", optional = true }
argon2 = { version = "0.5.3", optional = true }
password-hash = { version = "0.5.0", optional = true }
rand = { version = "0.8.5", optional = true }
tower-sessions = { version = "0.14", optional = true }
tower-sessions-sqlx-store = { version = "0.15.0", features = ["postgres"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
sha2 = { version = "0.10", optional = true }
hex = { version = "0.4", optional = true }
time = { version = "0.3", optional = true }

[features]
hydrate = [
    "leptos/hydrate",
    "dep:wasm-bindgen",
    "dep:console_error_panic_hook",
    "dep:web-sys",
]
ssr = [
    "leptos/ssr",
    "leptos_router/ssr",
    "dep:leptos_axum",
    "dep:axum",
    "dep:listenfd",
    "dep:tokio",
    "dep:tracing-subscriber",
    "dep:tower",
    "dep:tower-http",
    "dep:sqlx",
    "dep:dotenvy",
    "dep:chrono",
    "dep:argon2",
    "dep:password-hash",
    "dep:rand",
    "dep:tower-sessions",
    "dep:tower-sessions-sqlx-store",
    "dep:reqwest",
    "dep:sha2",
    "dep:hex",
    "dep:time",
]
http2 = []

[build-dependencies]
lightningcss = "1.0.0-alpha.71"

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[package.metadata.leptos]
output-name = "webserver"
site-root = "target/site"
site-pkg-dir = "pkg"
site-addr = "127.0.0.1:3000"
reload-port = 3001
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
lib-profile-release = "wasm-release"
watch-additional-files = ["assets/css", "assets/icons"]
