[package]
name = "webserver"
version = "0.1.0"
edition = "2024"

[dependencies]
askama = { version = "0.16.0", default-features = false, features = ["std", "derive"] }
axum = "0.8.9"
axum-extra = "0.10"
listenfd = "1.0.2"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.6.11", features = ["trace", "normalize-path", "fs"] }
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres", "macros"] }
dotenvy = "0.15.7"
chrono = "0.4.44"
argon2 = "0.5.3"
password-hash = "0.5.0"
rand = "0.8.5"
serde = { version = "1.0", features = ["derive"] }
tower-sessions = "0.14"
tower-sessions-sqlx-store = { version = "0.15.0", features = ["postgres"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
hex = "0.4"
time = "0.3"

[features]
http2 = []

[build-dependencies]
lightningcss = "1.0.0-alpha.71"
