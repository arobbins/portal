[package]
name = "webserver"
version = "0.1.0"
edition = "2024"

[dependencies]
topcoat = { version = "0.12.1", default-features = false, features = [
    "asset",
    "compression",
    "discover",
    "metadata",
    "router",
    "runtime",
    "serve",
    "tower",
    "view",
] }
axum = "0.8.9"
listenfd = "1.0.2"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.6.11", features = ["trace", "normalize-path", "fs", "set-header"] }
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres", "macros", "time", "uuid", "json"] }
dotenvy = "0.15.7"
chrono = "0.4.44"
argon2 = "0.5.3"
password-hash = "0.5.0"
rand = "0.8.5"
serde = { version = "1.0", features = ["derive"] }
tower-sessions = "0.14"
tower-sessions-sqlx-store = { version = "0.15.0", features = ["postgres"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
hex = "0.4"
time = "0.3"
serde_json = "1"
governor = "0.10.4"
webauthn-rs = { version = "0.6.2", features = ["danger-allow-state-serialisation", "conditional-ui", "danger-credential-internals"] }
uuid = { version = "1.29.2", features = ["v4", "serde"] }
webauthn-rs-core = "0.6.2"
url = "2"
serde_cbor_2 = "0.13"

[features]
http2 = []

[build-dependencies]
lightningcss = "1.0.0-alpha.71"
